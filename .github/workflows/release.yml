name: Release

on:
    release:
        types: [published]

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}

env:
    IMAGE: ${{ vars.DOCKERHUB_IMAGE || format('{0}/simplemavenrepo', vars.DOCKERHUB_USERNAME) }}

jobs:
    docker:
        name: Docker image
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: docker/setup-qemu-action@v4

            - uses: docker/setup-buildx-action@v4

            - uses: docker/login-action@v4
              with:
                  username: ${{ vars.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.IMAGE }}
                  flavor: latest=${{ !github.event.release.prerelease }}
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}},enable=${{ !github.event.release.prerelease }}
                      type=semver,pattern={{major}},enable=${{ !github.event.release.prerelease }}

            - uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: VERSION=${{ steps.meta.outputs.version }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
