info:
  name: Update artifact
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/api/artifacts/{{groupId}}/{{artifactId}}"
  body:
    type: json
    data: |-
      {
        "public": true,
        "description": "Demo library"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Omitted fields stay unchanged. An empty `description` clears it.
