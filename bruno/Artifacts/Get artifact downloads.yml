info:
  name: Get artifact downloads
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/api/artifacts/{{groupId}}/{{artifactId}}/downloads?days=30"
  params:
    - name: days
      value: "30"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
