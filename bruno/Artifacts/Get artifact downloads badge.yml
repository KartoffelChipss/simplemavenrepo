info:
  name: Get artifact downloads badge
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/badge/{{groupId}}/{{artifactId}}/downloads?period=month"
  params:
    - name: period
      value: "month"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "Without `?repo=<name>` the badge shows the artifact from a repository that only accepts releases if there is one, then from one that accepts both, then from a snapshot repository."
