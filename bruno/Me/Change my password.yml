info:
  name: Change my password
  type: http
  seq: 5

http:
  method: PUT
  url: "{{baseUrl}}/api/me/password"
  body:
    type: json
    data: |-
      {
        "currentPassword": "{{password}}",
        "newPassword": "a new password"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Changes the password and ends all other web UI sessions. `currentPassword` is only required if the user already
  has a password. Passwords must be 8-72 bytes.
