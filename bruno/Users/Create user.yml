info:
  name: Create user
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/users"
  body:
    type: json
    data: |-
      {
        "username": "{{username}}",
        "isAdmin": false,
        "password": "{{password}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "`password` is optional. Without one the user can only authenticate with tokens, not log in to the web UI."
