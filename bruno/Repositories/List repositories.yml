info:
  name: List repositories
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/repositories"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "Anyone can list the repositories, each is served under `/<name>`."
