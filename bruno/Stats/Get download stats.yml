info:
  name: Get download stats
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/stats/downloads?days=30"
  params:
    - name: days
      value: "30"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
